blueprint:
  name: Busch-Jaeger 6735/6736/6737 – Universal
  description: >
    Universal-Blueprint für Busch-Jaeger LightLink Schalter
    6735 (1-fach), 6736 (2-fach) und 6737 (4-fach), angebunden
    über Zigbee2MQTT.

    Die einzelnen Reihen sind optional.

    Kurzer Druck:
      - rechte Taste: Licht EIN
      - linke Taste: Licht AUS

    Langer Druck:
      - rechte Taste: heller
      - linke Taste: dunkler

    Beim Loslassen wird kein zusätzlicher Helligkeitsschritt
    ausgeführt.

    Als Ziel können einzelne Lichter oder ganze Bereiche (Areas)
    ausgewählt werden.

  domain: automation
  author: OpenAI

  input:

    device:
      name: Busch-Jaeger Gerät
      description: >
        Das Busch-Jaeger 6735, 6736 oder 6737 aus Zigbee2MQTT.
      selector:
        device:
          integration: mqtt

    row_1:
      name: Reihe 1 – Licht
      description: >
        Licht oder Bereich für Reihe 1. Leer lassen, wenn diese
        Reihe nicht verwendet werden soll.
      default: {}
      selector:
        target:
          entity:
            domain: light
          area: {}

    row_2:
      name: Reihe 2 – Licht
      description: >
        Licht oder Bereich für Reihe 2. Leer lassen, wenn diese
        Reihe nicht verwendet werden soll.
      default: {}
      selector:
        target:
          entity:
            domain: light
          area: {}

    row_3:
      name: Reihe 3 – Licht
      description: >
        Licht oder Bereich für Reihe 3. Leer lassen, wenn diese
        Reihe nicht verwendet werden soll.
      default: {}
      selector:
        target:
          entity:
            domain: light
          area: {}

    row_4:
      name: Reihe 4 – Licht
      description: >
        Licht oder Bereich für Reihe 4. Leer lassen, wenn diese
        Reihe nicht verwendet werden soll.
      default: {}
      selector:
        target:
          entity:
            domain: light
          area: {}

    dimming_step:
      name: Dimm-Schritt
      description: >
        Helligkeitsänderung pro brightness_step Event.
      default: 10
      selector:
        number:
          min: 1
          max: 25
          step: 1
          unit_of_measurement: "%"


mode: restart


triggers:

  # ============================================================
  # REIHE 1
  # ============================================================

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: on_row_1
    id: row1_on

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: off_row_1
    id: row1_off

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_up_row_1
    id: row1_up

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_down_row_1
    id: row1_down

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_stop_row_1
    id: row1_stop


  # ============================================================
  # REIHE 2
  # ============================================================

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: on_row_2
    id: row2_on

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: off_row_2
    id: row2_off

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_up_row_2
    id: row2_up

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_down_row_2
    id: row2_down

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_stop_row_2
    id: row2_stop


  # ============================================================
  # REIHE 3
  # ============================================================

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: on_row_3
    id: row3_on

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: off_row_3
    id: row3_off

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_up_row_3
    id: row3_up

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_down_row_3
    id: row3_down

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_stop_row_3
    id: row3_stop


  # ============================================================
  # REIHE 4
  # ============================================================

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: on_row_4
    id: row4_on

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: off_row_4
    id: row4_off

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_up_row_4
    id: row4_up

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_step_down_row_4
    id: row4_down

  - trigger: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: brightness_stop_row_4
    id: row4_stop


actions:

  - choose:

      # ========================================================
      # REIHE 1
      # ========================================================

      - conditions:
          - condition: trigger
            id: row1_on
        sequence:
          - action: light.turn_on
            target: !input row_1

      - conditions:
          - condition: trigger
            id: row1_off
        sequence:
          - action: light.turn_off
            target: !input row_1

      - conditions:
          - condition: trigger
            id: row1_up
        sequence:
          - action: light.turn_on
            target: !input row_1
            data:
              brightness_step_pct: !input dimming_step

      - conditions:
          - condition: trigger
            id: row1_down
        sequence:
          - action: light.turn_on
            target: !input row_1
            data:
              brightness_step_pct: "{{ 0 - (dimming_step | int) }}"


      # ========================================================
      # REIHE 2
      # ========================================================

      - conditions:
          - condition: trigger
            id: row2_on
        sequence:
          - action: light.turn_on
            target: !input row_2

      - conditions:
          - condition: trigger
            id: row2_off
        sequence:
          - action: light.turn_off
            target: !input row_2

      - conditions:
          - condition: trigger
            id: row2_up
        sequence:
          - action: light.turn_on
            target: !input row_2
            data:
              brightness_step_pct: !input dimming_step

      - conditions:
          - condition: trigger
            id: row2_down
        sequence:
          - action: light.turn_on
            target: !input row_2
            data:
              brightness_step_pct: "{{ 0 - (dimming_step | int) }}"


      # ========================================================
      # REIHE 3
      # ========================================================

      - conditions:
          - condition: trigger
            id: row3_on
        sequence:
          - action: light.turn_on
            target: !input row_3

      - conditions:
          - condition: trigger
            id: row3_off
        sequence:
          - action: light.turn_off
            target: !input row_3

      - conditions:
          - condition: trigger
            id: row3_up
        sequence:
          - action: light.turn_on
            target: !input row_3
            data:
              brightness_step_pct: !input dimming_step

      - conditions:
          - condition: trigger
            id: row3_down
        sequence:
          - action: light.turn_on
            target: !input row_3
            data:
              brightness_step_pct: "{{ 0 - (dimming_step | int) }}"


      # ========================================================
      # REIHE 4
      # ========================================================

      - conditions:
          - condition: trigger
            id: row4_on
        sequence:
          - action: light.turn_on
            target: !input row_4

      - conditions:
          - condition: trigger
            id: row4_off
        sequence:
          - action: light.turn_off
            target: !input row_4

      - conditions:
          - condition: trigger
            id: row4_up
        sequence:
          - action: light.turn_on
            target: !input row_4
            data:
              brightness_step_pct: !input dimming_step

      - conditions:
          - condition: trigger
            id: row4_down
        sequence:
          - action: light.turn_on
            target: !input row_4
            data:
              brightness_step_pct: "{{ 0 - (dimming_step | int) }}"
